[project]
name = "gao-5003-project"
version = "0.1.0"
description = "Initial sampling experiments for the 5003 stochastic processes project"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.1,<3",
    "matplotlib>=3.9,<4",
    "scipy>=1.14,<2",
    "scikit-learn>=1.6,<2",
    "torch>=2.6,<3; sys_platform == 'win32'",
]

[tool.uv]
package = false
cache-dir = ".uv-cache"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
